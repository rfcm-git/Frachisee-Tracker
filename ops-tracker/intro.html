<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3PD Helpdesk intro (standalone)</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f6f7f5; color: #1c2620; }
    main { max-width: 680px; margin: 0 auto; padding: 64px 20px; line-height: 1.6; }
    h1 { font-size: 28px; margin: 0 0 12px; }
    button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 0; background: #00703c; color: #fff; cursor: pointer; }
    button:focus-visible { outline: 3px solid #ffc20e; outline-offset: 3px; }
    code { background: #e7ebe8; padding: 1px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <!-- Your site's content. The intro is a fixed overlay mounted on top of it. -->
  <main id="main" tabindex="-1">
    <h1>Your site goes here</h1>
    <p>This page shows the 3D intro without React. It plays on load (once per session unless <code>?intro=1</code> is in the URL), then fades away to reveal this content.</p>
    <p><button type="button" id="replay">Play the intro again</button></p>
  </main>
  <script type="module" src="/src/intro/standalone.js"></script>
</body>
</html>
